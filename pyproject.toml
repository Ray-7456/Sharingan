[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sharingan"
version = "0.0.1"
description = "读懂规则、复制操作、生成可替代重复性工作的自动化工具"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = []

[project.optional-dependencies]
# 图形界面是可选的：核心保持零第三方依赖（见 docs/design.md §7）
ui = ["PySide6>=6.6"]
# 图标生成与图标资源测试需要 Pillow（tools/make_icons.py）
tools = ["Pillow>=10"]

[project.scripts]
sharingan = "sharingan.cli:main"

[tool.setuptools]
packages = [
    "sharingan",
    "sharingan.analysis",
    "sharingan.fixtures",
    "sharingan.formats",
    "sharingan.rules",
    "sharingan.ui",
]

[tool.setuptools.package-data]
sharingan = ["assets/icons/*.png", "assets/icons/*.ico", "assets/icons/*.icns"]
